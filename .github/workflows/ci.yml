name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/verify.py
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/browser-transaction.test.js

  grok-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify portable bridge protocol and configuration fixtures without model calls
        working-directory: integrations/grok-codex-bridge
        run: python -B -m unittest discover -s tests -v

  grok-windows-bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Require the Windows compiler for this job
        shell: powershell
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Windows bootstrap compiler is missing.' }
      - name: Verify native routing and compiled stdio bootstrap with synthetic fixtures
        working-directory: integrations/grok-codex-bridge
        run: python -B -m unittest tests.test_model_router tests.test_model_router_bootstrap -v
